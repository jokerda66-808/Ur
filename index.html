<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💀 RAM 8GB</title>
<style>
  body { background:#000; color:#0f0; font-family:monospace; margin:0; padding:10px; overflow:hidden; }
  #m { font-size:24px; color:#f0f; }
  #s { font-size:14px; color:#0ff; }
</style>
</head>
<body>
<div id="m">MEM: 0 GB</div>
<div id="s">Objects: 0</div>

<script>
let leak = [];
let count = 0;

// 🔥 كل عنصر ثقيل: نص 500 حرف + مصفوفة
// ~ 600 بايت فعلي لكل عنصر
// 15 مليون عنصر × 600 بايت ≈ 9GB
function makeHeavy() {
  return {
    a: Math.random(),
    b: "x".repeat(500),           // نص 500 حرف
    c: new Array(50).fill(1.5),   // مصفوفة 50 عنصر
    d: "y".repeat(200)
  };
}

// 🔥 نبني على دفعات عشان نقدر نعرض التقدم
const TOTAL = 15000000;   // 15 مليون عنصر
const BATCH = 500000;

function build() {
  if (count >= TOTAL) {
    document.getElementById('s').textContent = "DONE ✅ Objects: " + count.toLocaleString();
    return;
  }
  for (let i = 0; i < BATCH; i++) {
    leak.push(makeHeavy());
  }
  count += BATCH;
  document.getElementById('s').textContent = "Objects: " + count.toLocaleString();
  document.getElementById('m').textContent = "MEM: " + (count * 600 / 1024 / 1024 / 1024).toFixed(2) + " GB (تقديري)";
  setTimeout(build, 0);
}
build();
</script>
</body>
</html>
